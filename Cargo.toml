[package]
name = "mmatamm-backtest"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
flexi_logger = "0.29"
float_eq = "1.0"
mmatamm-interface = { git = "https://github.com/mmatamm/mmatamm-interface.git", version = "0.1.0" }
tabled = "0.16" # TODO: Make this optional
tokio = { version = "1.40", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
ahash = "0.8"
dashmap = "6.1"
hdf5 = { package="hdf5-metno", version = "0.10", features = ["blosc-lz4", "static"] }
ndarray = "0.16"
thiserror = "2.0"
